# Frontend service uses Dockerfile.dev + a bind mount so source edits show up without rebuilding.
# Default stack (db, backend, frontend, qdrant, ingestion) sends all model work to the
# Kaggle GPU server (services/kaggle). Local models instead: `--profile local-ml` (make up-local).

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: vocalmind-db
    restart: unless-stopped
    cpus: 1.0
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: vocalmind
      POSTGRES_USER: vocalmind
      POSTGRES_PASSWORD: vocalmind_dev
    volumes:
      - vocalmind_data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vocalmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocalmind-backend
    env_file:
      - ./.env
      - ./backend/.env
    cpus: 2.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # DATABASE_URL / ASSISTANT_DATABASE_URL come from backend/.env (Supabase pooler in prod-like demos).
      - SECRET_KEY=${SECRET_KEY:-vocalmind_local_dev_secret_change_in_env}
      # false = Kaggle GPU server (default); true = local-ml profile containers
      - IS_LOCAL=${IS_LOCAL:-false}
      - RAG_MODELS_HOST=${RAG_MODELS_HOST:-kaggle}
      # KAGGLE_SERVER_URL comes from .env / backend/.env (the notebook also registers itself)
      - EMOTION_API_URL=http://emotion:8000
      - VAD_API_URL=http://vad:8002
      - WHISPERX_API_URL=http://whisperx:8000
      - FRONTEND_URL=http://localhost:3000
      - LOCAL_AUDIO_STORAGE_DIR=/app/storage/uploads
      - EXTRA_AUDIO_ROOTS=/app/storage/audio_import
      # LLM / Groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      # Manager assistant: Ollama Cloud by default (override via ASSISTANT_LLM_PROVIDER)
      - ASSISTANT_LLM_PROVIDER=${ASSISTANT_LLM_PROVIDER:-ollama_cloud}
      - ASSISTANT_OLLAMA_MODEL=qwen2.5:7b
      # RAG — point at Docker service names, not localhost
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_PARENTS=${QDRANT_COLLECTION_PARENTS:-vocalmind_parents}
      - QDRANT_COLLECTION_SOP_PARENTS=${QDRANT_COLLECTION_SOP_PARENTS:-vocalmind_sop_parents}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-snowflake-arctic-embed2}
      - SOP_RETRIEVAL_TOP_K=${SOP_RETRIEVAL_TOP_K:-3}
      # Ollama Cloud (when LLM_PROVIDER=ollama_cloud)
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_CLOUD_HEAVY_MODEL=${OLLAMA_CLOUD_HEAVY_MODEL:-kimi-k2.6:cloud}
      - OLLAMA_CLOUD_FAST_MODEL=${OLLAMA_CLOUD_FAST_MODEL:-ministral-3:8b}
      - OLLAMA_MODEL_EMOTION_SHIFT=${OLLAMA_MODEL_EMOTION_SHIFT:-}
      - OLLAMA_MODEL_PROCESS_ADHERENCE=${OLLAMA_MODEL_PROCESS_ADHERENCE:-}
      - OLLAMA_MODEL_NLI_POLICY=${OLLAMA_MODEL_NLI_POLICY:-}
      - OLLAMA_MODEL_RAG_JUDGE=${OLLAMA_MODEL_RAG_JUDGE:-}
      - OLLAMA_MODEL_TEXT_TO_SQL=${OLLAMA_MODEL_TEXT_TO_SQL:-}
      - OLLAMA_MODEL_FAST_CLASSIFICATION=${OLLAMA_MODEL_FAST_CLASSIFICATION:-}
      - OLLAMA_MODEL_RAG_SYNTHESIS=${OLLAMA_MODEL_RAG_SYNTHESIS:-}
      - OLLAMA_CLOUD_EMBED_ENABLED=${OLLAMA_CLOUD_EMBED_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama_cloud}
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/infra:/app/infra:ro
      - ./storage:/app/storage
      - ./audio_import:/app/storage/audio_import:ro
      # Mount services/rag so backend can `from rag.evaluator import PolicyComplianceEvaluator`
      # and `from rag.query_engine import RAGQueryEngine` without a separate package install.
      - ./services/rag:/app/rag:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vocalmind-frontend
    cpus: 1.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Empty = same-origin /api via Vite proxy (works for localhost + ngrok tunnels).
      - VITE_API_URL=
      - VITE_DEV_PROXY_TARGET=http://backend:8000
      # When wired to a real backend via compose, the frontend talks to the API.
      # Offline demo mode (bundled session export) is opt-in via VITE_USE_OFFLINE_DEMO=true.
    volumes:
      - ./frontend:/app
      - vocalmind_frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "if [ ! -f node_modules/.bin/vite ]; then pnpm install; fi && pnpm run dev"]
    restart: unless-stopped

  # ── Local Ollama (embeddings + optional local LLM) ─────────────────────────
  ollama:
    image: ollama/ollama:0.24.0
    profiles: ["local-ml"]
    container_name: vocalmind-ollama
    cpus: 4.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.1
    container_name: vocalmind-qdrant
    cpus: 1.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Ingestion Pipeline ─────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./services/rag
      dockerfile: Dockerfile
      args:
        # true = install Docling + cross-encoder for RAG_MODELS_HOST=local (several GB)
        RAG_LOCAL_MODELS: ${RAG_LOCAL_MODELS:-false}
    container_name: vocalmind-ingestion
    cpus: 2.0
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./services/rag/config.py:/app/config.py:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-snowflake-arctic-embed2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - DOCS_DIR=/app/storage/docs
      - POLICY_DOCS_DIR=/app/storage/docs
      - KNOWLEDGE_DOCS_DIR=/app/storage/docs
      - PARSED_POLICY_DIR=/app/storage/docs
      - PARSED_SOP_DIR=/app/storage/docs
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-${OLLAMA_API_KEY:-}}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_CLOUD_HEAVY_MODEL=${OLLAMA_CLOUD_HEAVY_MODEL:-kimi-k2.6:cloud}
      - OLLAMA_CLOUD_FAST_MODEL=${OLLAMA_CLOUD_FAST_MODEL:-ministral-3:8b}
      - OLLAMA_MODEL_EMOTION_SHIFT=${OLLAMA_MODEL_EMOTION_SHIFT:-}
      - OLLAMA_MODEL_PROCESS_ADHERENCE=${OLLAMA_MODEL_PROCESS_ADHERENCE:-}
      - OLLAMA_MODEL_NLI_POLICY=${OLLAMA_MODEL_NLI_POLICY:-}
      - OLLAMA_MODEL_RAG_JUDGE=${OLLAMA_MODEL_RAG_JUDGE:-}
      - OLLAMA_MODEL_TEXT_TO_SQL=${OLLAMA_MODEL_TEXT_TO_SQL:-}
      - OLLAMA_MODEL_FAST_CLASSIFICATION=${OLLAMA_MODEL_FAST_CLASSIFICATION:-}
      - OLLAMA_MODEL_RAG_SYNTHESIS=${OLLAMA_MODEL_RAG_SYNTHESIS:-}
      - OLLAMA_CLOUD_EMBED_ENABLED=${OLLAMA_CLOUD_EMBED_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama_cloud}
      - RAG_MODELS_HOST=${RAG_MODELS_HOST:-kaggle}
      - KAGGLE_SERVER_URL=${KAGGLE_SERVER_URL:-}
    restart: unless-stopped

  # ── VAD Preprocessing ──────────────────────────────────────────────────────
  vad:
    build:
      context: ./services/vad
    profiles: ["local-ml"]
    container_name: vocalmind-vad
    cpus: 2.0
    ports:
      - "8002:8002"
    volumes:
      - ./services/vad/app.py:/app/app.py:ro
      - vad_torch_cache:/root/.cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Emotion Recognition ────────────────────────────────────────────────────
  emotion:
    pull_policy: if_not_present
    build:
      context: ./services/emotion
    profiles: ["local-ml"]
    container_name: vocalmind-emotion
    cpus: 2.0
    ports:
      - "8001:8000"
    volumes:
      - ./services/emotion/app.py:/app/app.py
      - emotion_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── WhisperX ASR ───────────────────────────────────────────────────────────
  whisperx:
    pull_policy: if_not_present
    build:
      context: ./services/whisperx
      dockerfile: Dockerfile
    image: grad-whisperx:latest
    profiles: ["local-ml"]
    container_name: vocalmind-whisperx
    cpus: 4.0
    ports:
      - "8003:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL_SIZE=tiny
      # Stereo / split-channel telephony: bypass PyAnnote, assign by channel energy.
      # Mono and mono-duplicated audio fall through to the standard cluster path.
      - CHANNEL_DIARIZATION_ENABLED=${CHANNEL_DIARIZATION_ENABLED:-true}
      - CHANNEL_DIARIZATION_MAX_CORR=${CHANNEL_DIARIZATION_MAX_CORR:-0.92}
      # Optional: pin agent channel ("0" or "1"). Unset = pick by first-window
      # energy. Set explicitly for fixed-convention PBX/SBC deployments.
      - AGENT_CHANNEL=${AGENT_CHANNEL:-}
      # Cluster diarization: constrain pyannote to the known speaker count.
      # These are 1:1 agent/customer calls; without this pyannote over-clusters
      # a single mono speaker's prosody into many spurious clusters. 0 = off.
      - DIARIZATION_NUM_SPEAKERS=${DIARIZATION_NUM_SPEAKERS:-2}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/whisperx/app.py:/app/app.py
      # Persist HF + torch hub model caches across container recreations.
      # Without this, every recreate re-downloads faster-whisper-large-v3
      # (~3GB), wav2vec2 alignment (~360MB), and pyannote diarization (~100MB).
      - whisperx_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

volumes:
  vocalmind_data:
  ollama_data:
  qdrant_data:
  vocalmind_frontend_node_modules:
  whisperx_cache:
  emotion_cache:
  vad_torch_cache:
